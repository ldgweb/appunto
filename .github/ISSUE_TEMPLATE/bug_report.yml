name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please don't paste the content of your board: it may hold private notes. A few made-up lines that show the problem are enough.
        Report security issues privately, as described in SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → About, or the commit hash if you built it yourself.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux, X11 session
        - Linux, Wayland session
    validations:
      required: true
  - type: input
    id: details
    attributes:
      label: System details
      description: Version, and on Linux the desktop (GNOME, KDE…) and how you installed the app (AppImage, deb, rpm).
      placeholder: "Ubuntu 24.04, GNOME, AppImage"
