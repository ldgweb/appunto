name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Appunto tries to stay small: one board, ready in a second. Ideas that keep it quick are the easiest to take in.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is slow, awkward or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would help?
