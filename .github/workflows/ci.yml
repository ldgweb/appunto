# CI: the checks that gate every change. Windows runs everything, including
# formatting and the dependency audits; macOS and Linux build the app and run
# the same tests and lints, because part of the native code only exists there
# (menu bar, Dock, tray, Wayland). A secret scan covers the whole history.
#
# Third-party actions are pinned to commit SHAs; Dependabot proposes updates.
# Checkouts don't keep the token, so build scripts can't read it.
# The Rust toolchain comes from src-tauri/rust-toolchain.toml.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces its running checks; on main every
# commit gets a full run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install the pinned Rust toolchain
        working-directory: src-tauri
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Versions agree
        run: npm run check:version

      - name: Formatting
        run: npm run format:check

      - name: Typecheck + frontend build
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Dependency audits
        run: |
          npm audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run audit:rust

      - name: Rust formatting and lints
        working-directory: src-tauri
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --release --locked --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --release --locked

  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tauri 2's Linux prerequisites: WebKitGTK 4.1, GTK 3 and the tray library.
      - name: Install Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential pkg-config

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install the pinned Rust toolchain
        working-directory: src-tauri
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # The app embeds dist/ at compile time, so the frontend comes first.
      - name: Frontend build and tests
        run: npm ci && npm run build && npm test

      - name: Rust lints and tests
        working-directory: src-tauri
        run: |
          cargo clippy --release --locked --all-targets -- -D warnings
          cargo test --release --locked

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the full history for secrets (pinned, checksum-verified gitleaks)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose --config .gitleaks.toml .
