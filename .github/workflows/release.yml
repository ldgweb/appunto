# Release: on a `v*` tag, check the version, rerun the tests, build the
# Windows, macOS and Linux packages and attach them to a draft GitHub release,
# with SHA256SUMS.txt. I try the draft by hand before publishing it.
# No build cache here: release binaries always come from a clean state.
# Checkouts don't keep the token, so build scripts can't read it; only the
# steps that talk to GitHub get it.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the full history for secrets (pinned, checksum-verified gitleaks)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose --config .gitleaks.toml .

  draft:
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tag and versions agree
        run: node scripts/check-version.mjs "$RELEASE_TAG"
      # Again here: a new advisory may have appeared since the last CI run.
      - name: Dependency audits
        run: |
          npm audit
          npm run audit:rust
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$RELEASE_TAG" --draft --title "Appunto $RELEASE_TAG" --generate-notes

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundles: nsis
            target: ''
          - os: macos-latest
            platform: macos
            bundles: app,dmg
            target: universal-apple-darwin
          # The oldest supported Ubuntu keeps the packages compatible with
          # older glibc versions.
          - os: ubuntu-22.04
            platform: linux
            bundles: deb,rpm,appimage
            target: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential pkg-config patchelf file

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the pinned Rust toolchain
        working-directory: src-tauri
        run: |
          rustup toolchain install
          if [ "${{ matrix.platform }}" = macos ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi

      - name: Install and test
        run: |
          npm ci
          npm test
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml

      - name: Build the packages
        run: |
          if [ -n "${{ matrix.target }}" ]; then target="--target ${{ matrix.target }}"; else target=""; fi
          npm run tauri -- build --ci --bundles ${{ matrix.bundles }} $target -- --locked

      - name: Attach the packages to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/collect-release.mjs ${{ matrix.platform }}
          gh release upload "$RELEASE_TAG" release-files/* --clobber

  checksums:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Add SHA256SUMS.txt to the draft release
        run: |
          mkdir assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir assets --pattern '*' --skip-existing
          rm -f assets/SHA256SUMS.txt
          (cd assets && sha256sum * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
