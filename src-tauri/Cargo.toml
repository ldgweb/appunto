[package]
name = "appunto"
version = "0.1.0"
description = "A tiny blackboard for quick notes and sketches, one shortcut away"
authors = ["Lucio (ldgweb)"]
edition = "2021"
license = "MIT"
repository = "https://github.com/ldgweb/appunto"
publish = false

[lib]
name = "appunto"
path = "src/lib.rs"

[[bin]]
name = "appunto"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdb = "0.24"
sys-locale = "0.3"

# Already in the tree through the autostart plugin; writes the login entry.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

# Small and fast: the app runs all day in the background.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
